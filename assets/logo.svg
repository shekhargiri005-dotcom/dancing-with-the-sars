<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1E38" />
      <stop offset="60%" stop-color="#07101E" />
      <stop offset="100%" stop-color="#03070E" />
    </radialGradient>

    <!-- Radar Glow Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="radarArcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00FFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="icePeakLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F7FA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="icePeakRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>

    <linearGradient id="floodWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFFF" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#00FFFF" />
    </linearGradient>

    <linearGradient id="goldDish" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="neonBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Circular Mission Patch Frame -->
  <circle cx="256" cy="256" r="248" fill="url(#spaceBg)" stroke="rgba(0, 255, 255, 0.28)" stroke-width="3" />
  
  <!-- Outer Aerospace Reticle Calibration Rings -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="rgba(0, 255, 255, 0.15)" stroke-width="1" />

  <!-- Cardinal Compass Coordinates Marks -->
  <line x1="256" y1="8" x2="256" y2="28" stroke="#00FFFF" stroke-width="3" />
  <line x1="256" y1="484" x2="256" y2="504" stroke="#00FFFF" stroke-width="3" />
  <line x1="8" y1="256" x2="28" y2="256" stroke="#00FFFF" stroke-width="3" />
  <line x1="484" y1="256" x2="504" y2="256" stroke="#00FFFF" stroke-width="3" />

  <!-- Orbit Path (Inclined Ellipse) -->
  <ellipse cx="256" cy="256" rx="210" ry="85" fill="none" stroke="rgba(0, 255, 255, 0.35)" stroke-width="1.8" transform="rotate(-28 256 256)" stroke-dasharray="12 6" />

  <!-- ===================================================================
       1. SPACEBORNE RADAR COMPONENT (TOP: NISAR 12m MESH REFLECTOR)
       =================================================================== -->
  <g id="satellite-group">
    <!-- Parabolic Reflector Dish Mesh -->
    <path d="M 196 95 Q 256 62 316 95 Q 256 82 196 95 Z" fill="url(#goldDish)" stroke="#FEF08A" stroke-width="1.5" filter="url(#subtleGlow)" />
    <!-- Dish Grid Facets -->
    <line x1="220" y1="87" x2="235" y2="74" stroke="rgba(0,0,0,0.4)" stroke-width="1" />
    <line x1="256" y1="84" x2="256" y2="70" stroke="rgba(0,0,0,0.4)" stroke-width="1" />
    <line x1="292" y1="87" x2="277" y2="74" stroke="rgba(0,0,0,0.4)" stroke-width="1" />
    
    <!-- Feed Horn & Boom Struts -->
    <line x1="256" y1="74" x2="256" y2="120" stroke="#00FFFF" stroke-width="2.5" />
    <line x1="210" y1="92" x2="256" y2="120" stroke="rgba(0, 255, 255, 0.7)" stroke-width="1.2" />
    <line x1="302" y1="92" x2="256" y2="120" stroke="rgba(0, 255, 255, 0.7)" stroke-width="1.2" />
    <!-- Transceiver Feed Pulse Node -->
    <circle cx="256" cy="120" r="5" fill="#00FFFF" filter="url(#neonBlur)" />
    <circle cx="256" cy="120" r="2.5" fill="#FFFFFF" />

    <!-- Active L-Band Microwave Pulse Arcs (24.2 cm Wave Propagation) -->
    <path d="M 216 138 A 45 45 0 0 1 296 138" fill="none" stroke="url(#radarArcGrad)" stroke-width="2" opacity="0.9" />
    <path d="M 188 156 A 80 80 0 0 1 324 156" fill="none" stroke="url(#radarArcGrad)" stroke-width="2.5" opacity="0.8" />
    <path d="M 160 176 A 115 115 0 0 1 352 176" fill="none" stroke="url(#radarArcGrad)" stroke-width="3" opacity="0.7" />
    <path d="M 132 198 A 150 150 0 0 1 380 198" fill="none" stroke="url(#radarArcGrad)" stroke-width="3.5" opacity="0.55" />
  </g>

  <!-- ===================================================================
       2. CRYOSPHERE COMPONENT (CENTER: MOUNTAIN GLACIER ICE PEAK)
       =================================================================== -->
  <g id="mountain-ice-group">
    <!-- Left Facet of Main Ice Peak -->
    <polygon points="256,182 170,330 256,310" fill="url(#icePeakLeft)" stroke="rgba(0, 255, 255, 0.5)" stroke-width="1.5" />
    <!-- Right Facet of Main Ice Peak -->
    <polygon points="256,182 256,310 342,330" fill="url(#icePeakRight)" stroke="rgba(0, 255, 255, 0.5)" stroke-width="1.5" />
    <!-- Central Ridge Glare -->
    <line x1="256" y1="182" x2="256" y2="310" stroke="#FFFFFF" stroke-width="2" filter="url(#subtleGlow)" />

    <!-- Secondary Flanking Ice Peaks (Himalayan Ridge) -->
    <polygon points="170,330 118,360 195,360" fill="#0369A1" opacity="0.8" />
    <polygon points="170,330 195,360 220,330" fill="#0284C7" opacity="0.6" />
    <polygon points="342,330 394,360 317,360" fill="#075985" opacity="0.8" />
    <polygon points="342,330 317,360 292,330" fill="#0369A1" opacity="0.6" />

    <!-- InSAR Interferometric Deformation Contour Fringe Arcs on Mountain -->
    <path d="M 226 235 Q 256 220 286 235" fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.85" />
    <path d="M 205 270 Q 256 250 307 270" fill="none" stroke="#00FFFF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.75" />
    <path d="M 188 300 Q 256 275 324 300" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="5 5" opacity="0.65" />

    <!-- Peak Apex Laser Beacon Signal Pin -->
    <circle cx="256" cy="182" r="4.5" fill="#00FFFF" filter="url(#neonBlur)" />
    <circle cx="256" cy="182" r="2" fill="#FFFFFF" />
  </g>

  <!-- ===================================================================
       3. HYDROLOGY COMPONENT (BOTTOM: CATASTROPHIC GLOF FLOOD WAVE)
       =================================================================== -->
  <g id="flood-wave-group">
    <!-- Back Deep Wave Body -->
    <path d="M 80 405 C 140 370, 200 425, 256 385 C 312 345, 372 400, 432 375 L 432 445 C 372 470, 312 435, 256 460 C 200 485, 140 440, 80 445 Z" fill="#0A3161" opacity="0.85" />

    <!-- Primary Turbulent Flood Surge Wave -->
    <path d="M 96 385 C 160 350, 210 405, 256 370 C 302 335, 352 385, 416 360 L 416 425 C 352 445, 302 400, 256 425 C 210 450, 160 410, 96 425 Z" fill="url(#floodWave1)" opacity="0.85" filter="url(#subtleGlow)" />

    <!-- Cresting Foam / Specular Water Edge Highlights -->
    <path d="M 96 385 C 160 350, 210 405, 256 370 C 302 335, 352 385, 416 360" fill="none" stroke="#FFFFFF" stroke-width="2.5" filter="url(#subtleGlow)" />
    <path d="M 112 405 C 170 375, 215 420, 256 390 C 297 360, 342 405, 400 380" fill="none" stroke="#00FFFF" stroke-width="1.8" opacity="0.9" />
    <path d="M 128 425 C 180 400, 220 435, 256 410 C 292 385, 332 420, 384 400" fill="none" stroke="#38BDF8" stroke-width="1.2" opacity="0.75" />

    <!-- Exposed Boulders / Rough Lakebed Sediment Dots (+10 dB Backscatter) -->
    <circle cx="150" cy="430" r="3" fill="#00FFFF" opacity="0.8" />
    <circle cx="210" cy="445" r="2.5" fill="#38BDF8" opacity="0.8" />
    <circle cx="270" cy="435" r="3.5" fill="#00FFFF" opacity="0.9" />
    <circle cx="330" cy="440" r="2" fill="#38BDF8" opacity="0.7" />
    <circle cx="380" cy="420" r="3" fill="#00FFFF" opacity="0.85" />
  </g>

  <!-- Mission Patch Typography Sub-Arc -->
  <text font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="4" text-anchor="middle">
    <textPath href="#textPathTop" startOffset="50%">NISAR • 24.2 CM L-BAND</textPath>
  </text>
  <path id="textPathTop" d="M 100 135 A 190 190 0 0 1 412 135" fill="none" />

  <text font-family="'JetBrains Mono', 'Plus Jakarta Sans', monospace" font-size="11" font-weight="700" fill="#00FFFF" letter-spacing="3.5" text-anchor="middle">
    <textPath href="#textPathBottom" startOffset="50%">HOW ICE BECOMES A FLOOD</textPath>
  </text>
  <path id="textPathBottom" d="M 100 455 A 190 190 0 0 0 412 455" fill="none" />
</svg>

